name: customer_mobile
description: "سوقنا - لقطة في كل حاجة"
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.2

  # UI Enhancements
  fluttertoast: ^8.2.6
  url_launcher: ^6.3.0

  # Video Playback
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
